name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake g++
    
    - name: Build project
      run: |
        mkdir build
        cd build
        cmake ..
        cmake --build .
    
    - name: Test binary
      run: |
        ./build/tomport sample-server.xml
    
    - name: Test with invalid file
      run: |
        ./build/tomport nonexistent.xml || true
