name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake g++
    
    - name: Build project
      run: |
        mkdir build
        cd build
        cmake ..
        cmake --build .
    
    - name: Test binary
      run: |
        ./build/tomport sample-server.xml
    
    - name: Package binary
      run: |
        mkdir -p tomport-linux-x64
        cp build/tomport tomport-linux-x64/
        cp README.md tomport-linux-x64/
        cp sample-server.xml tomport-linux-x64/
        tar -czf tomport-linux-x64.tar.gz tomport-linux-x64/
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: tomport-linux-x64
        path: tomport-linux-x64.tar.gz
    
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: tomport-linux-x64.tar.gz
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
